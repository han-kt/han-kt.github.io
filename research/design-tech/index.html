    <script>
    (function () {
        function initSiteChrome() {
            var themeToggle = document.getElementById('theme-toggle');
            var mobileMenuBtn = document.getElementById('mobile-menu-btn');
            var mobileMenu = document.getElementById('mobile-menu');
            function initTheme() {
                var saved = localStorage.getItem('theme') || 'light';
                document.documentElement.classList.toggle('dark', saved === 'dark');
                updateIcon(saved);
            }
            function updateIcon(theme) {
                if (!themeToggle) return;
                var icon = themeToggle.querySelector('i');
                if (!icon) return;
                icon.className = theme === 'dark' ? 'fas fa-sun text-yellow-500' : 'fas fa-moon text-gray-600 dark:text-gray-300';
            }
            function toggleTheme() {
                var dark = document.documentElement.classList.toggle('dark');
                var t = dark ? 'dark' : 'light';
                localStorage.setItem('theme', t);
                updateIcon(t);
            }
            initTheme();
            if (themeToggle) themeToggle.addEventListener('click', function (e) { e.preventDefault(); toggleTheme(); });
            if (mobileMenuBtn && mobileMenu) {
                mobileMenuBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    mobileMenu.classList.toggle('hidden');
                    mobileMenuBtn.setAttribute('aria-expanded', (!mobileMenu.classList.contains('hidden')).toString());
                });
            }
            var header = document.getElementById('header');
            if (header) {
                var last = 0;
                window.addEventListener('scroll', function () {
                    var cur = window.pageYOffset;
                    if (cur > last && cur > 100) header.style.transform = 'translateY(-100%)';
                    else header.style.transform = 'translateY(0)';
                    last = cur;
                });
            }
            if (mobileMenuBtn && mobileMenu) {
                document.addEventListener('click', function (e) {
                    if (!mobileMenuBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
                        mobileMenu.classList.add('hidden');
                        mobileMenuBtn.setAttribute('aria-expanded', 'false');
                    }
                });
            }
            var fy = document.getElementById('footer-year');
            if (fy) fy.textContent = new Date().getFullYear();
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initSiteChrome);
        else initSiteChrome();
    })();
    </script>

    <!-- Research area filtering script -->
    <script>
        // Research area configuration
        const researchArea = {
            id: "design-tech",
            title: "Design Technology",
            keywords: ["design"],
            specialKeywords: []
        };

        // Global variables
        let fuse;
        let filteredPublications = [];
        let allRelatedPublications = [];

        // DOM elements
        const searchInput = document.getElementById('search-input');
        const filterSelect = document.getElementById('filter-select');
        const publicationsList = document.getElementById('publications-list');

        // Check if publications data is loaded
        function checkPublicationsData() {
            if (typeof publications === 'undefined') {
                console.error('Publications data not loaded!');
                return false;
            }
            return true;
        }

        // Filter publications for this research area using manual assignments
        function filterPublicationsForResearchArea() {
            console.log('filterPublicationsForResearchArea called');
            console.log('researchArea.id:', researchArea.id);
            if (!checkPublicationsData()) return;

            const relatedConferences = [];
            const relatedJournals = [];
            const relatedPatents = [];
            const relatedBooks = [];

            // Filter publications based on manual research_area assignments
            publications.forEach(pub => {
                if (pub.research_area && pub.research_area.includes(researchArea.id)) {
                    if (pub.type === 'patent') {
                        relatedPatents.push(pub);
                    } else if (pub.type === 'conference') {
                        relatedConferences.push(pub);
                    } else if (pub.type === 'journal') {
                        relatedJournals.push(pub);
                    } else if (pub.type === 'book') {
                        relatedBooks.push(pub);
                    }
                }
            });

            // Update counts and show/hide based on content
            const conferencesCountEl = document.getElementById('conferences-count');
            const journalsCountEl = document.getElementById('journals-count');
            const patentsCountEl = document.getElementById('patents-count');
            const booksCountEl = document.getElementById('books-count');
            
            conferencesCountEl.textContent = relatedConferences.length;
            journalsCountEl.textContent = relatedJournals.length;
            patentsCountEl.textContent = relatedPatents.length;
            booksCountEl.textContent = relatedBooks.length;
            
            // Hide count sections that are zero
            conferencesCountEl.parentElement.style.display = relatedConferences.length > 0 ? 'block' : 'none';
            journalsCountEl.parentElement.style.display = relatedJournals.length > 0 ? 'block' : 'none';
            patentsCountEl.parentElement.style.display = relatedPatents.length > 0 ? 'block' : 'none';
            booksCountEl.parentElement.style.display = relatedBooks.length > 0 ? 'block' : 'none';

            // Combine all related publications
            allRelatedPublications = [...relatedConferences, ...relatedJournals, ...relatedPatents, ...relatedBooks];

            // Initialize search with filtered publications
            initSearch();
        }

        // Initialize search
        function initSearch() {
            if (!checkPublicationsData()) return;

            const options = {
                keys: ['title', 'authors', 'venue'],
                threshold: 0.3,
                includeScore: true
            };
            fuse = new Fuse(allRelatedPublications, options);
            
            filteredPublications = [...allRelatedPublications];
            renderPublications();
        }

        // Filter publications
        function filterPublications() {
            if (!checkPublicationsData()) return;

            let results = allRelatedPublications;

            // Apply search filter
            if (searchInput.value.trim()) {
                const searchResults = fuse.search(searchInput.value);
                results = searchResults.map(result => result.item);
            }

            // Apply type filter
            const typeFilter = filterSelect.value;
            if (typeFilter !== 'all') {
                results = results.filter(pub => pub.type === typeFilter);
            }

            // Sort by year (descending - newest first)
            results.sort((a, b) => b.year - a.year);
            
            filteredPublications = results;
            renderPublications();
        }

        // Render publications (badge-style, matches homepage Selected Publications)
        function renderPublications() {
            if (!checkPublicationsData()) return;

            publicationsList.innerHTML = filteredPublications.map((pub) => {
                // Venue abbreviations for the badge
                let venueAbbr = pub.venue;
                if (pub.venue.includes('IEEE Transactions on Intelligent Vehicles')) {
                    venueAbbr = 'IEEE Trans. Intelligent Vehicles';
                } else if (pub.venue.includes('IEEE Transactions on Intelligent Transportation Systems')) {
                    venueAbbr = 'IEEE T-ITS';
                } else if (pub.venue.includes('IEEE Internet of Things Journal')) {
                    venueAbbr = 'IEEE IoT Journal';
                } else if (pub.venue.includes('IEEE Transactions on Vehicular Technology')) {
                    venueAbbr = 'IEEE TVT';
                } else if (pub.venue.includes('IEEE Intelligent Vehicles Symposium')) {
                    venueAbbr = 'IEEE IV';
                } else if (pub.venue.includes('IEEE International Conference on Intelligent Transportation Systems')) {
                    venueAbbr = 'IEEE ITSC';
                }

                // Type-aware badge text and optional secondary line (e.g., patent number)
                const is_book_chapter = pub.venue && pub.venue.startsWith('In:');
                let venueBadgeText;
                let detailLine = '';
                if (pub.type === 'patent') {
                    venueBadgeText = pub.venue.includes('Application') ? 'US Patent Application' : 'US Patent';
                    const patentDetail = pub.venue.replace(/^US Patent (Application )?/, '');
                    if (patentDetail && patentDetail !== pub.venue) {
                        detailLine = `<p class="text-xs text-gray-500 dark:text-gray-400 mb-2">${patentDetail}</p>`;
                    }
                } else if (pub.type === 'book') {
                    venueBadgeText = is_book_chapter ? 'Book Chapter' : 'Book';
                } else {
                    venueBadgeText = venueAbbr;
                }

                // Bold "K. Han" / "Kyungtae Han" / "Han, Kyungtae" so the author signal pops
                const authorsBolded = (pub.authors || '').replace(
                    /(K\.\s*Han\b|Kyungtae\s+Han\b|Han,\s*Kyungtae\b)/g,
                    '<strong>$1</strong>'
                );

                // Inline links: View paper / View patent / Book webpage + PDF
                const linkLabel = pub.type === 'patent'
                    ? 'View patent'
                    : pub.type === 'book'
                        ? 'Book webpage'
                        : 'View paper';
                const linksParts = [];
                if (pub.url) {
                    const resolvedUrl = pub.url;
                    const openInNewTab = pub.url.startsWith('http');
                    linksParts.push(`<a href="${resolvedUrl}"${openInNewTab ? ' target="_blank"' : ''} class="text-sm text-blue-600 dark:text-blue-400 hover:underline">${linkLabel} &rarr;</a>`);
                }
                if (pub.pdf) {
                    linksParts.push(`<a href="${pub.pdf}" target="_blank" class="text-sm text-blue-600 dark:text-blue-400 hover:underline">PDF &rarr;</a>`);
                }
                const linksLine = linksParts.length
                    ? `<div class="flex flex-wrap items-center gap-x-4 gap-y-1">${linksParts.join('')}</div>`
                    : '';

                const yearText = pub.year_text || pub.year || '';
                const notePill = pub.note
                    ? `<span class="text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400">${pub.note}</span>`
                    : '';

                return `
                    <div class="bg-white dark:bg-gray-900 rounded-lg p-6 border border-gray-200 dark:border-gray-700">
                        <div class="flex flex-wrap items-center gap-2 mb-2">
                            <span class="text-xs font-semibold uppercase tracking-wide px-2 py-0.5 rounded bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300">${venueBadgeText}</span>
                            ${yearText ? `<span class="text-xs text-gray-500 dark:text-gray-400">${yearText}</span>` : ''}
                            ${notePill}
                        </div>
                        <p class="text-gray-900 dark:text-white font-medium mb-1 leading-snug">${pub.title}</p>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">${authorsBolded}</p>
                        ${detailLine}
                        ${linksLine}
                    </div>
                `;
            }).join('');
        }

        // Handle stat clicks: filter lists within the page
        function handleStatClick(kind) {
            if (!allRelatedPublications.length) return;
            
            let pubs = [];
            if (kind === 'conference') {
                pubs = allRelatedPublications.filter(p => p.type === 'conference');
            } else if (kind === 'journal') {
                pubs = allRelatedPublications.filter(p => p.type === 'journal');
            } else if (kind === 'patent') {
                pubs = allRelatedPublications.filter(p => p.type === 'patent');
            } else if (kind === 'book') {
                pubs = allRelatedPublications.filter(p => p.type === 'book');
            } else {
                pubs = allRelatedPublications;
            }

            // Update filter select
            filterSelect.value = kind === 'all' ? 'all' : kind;
            
            // Apply filter
            filterPublications();

            // Scroll to list
            const list = document.getElementById('publications-list');
            if (list) list.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Initialize when DOM is loaded and publications data is available
        function initializeResearchArea() {
            console.log('Initializing research area...');
            console.log('Publications available:', typeof publications !== 'undefined');
            
            if (typeof publications !== 'undefined' && publications.length > 0) {
                console.log('Publications data loaded, filtering publications...');
                filterPublicationsForResearchArea();
                
                // Add event listeners for search and filter
                searchInput.addEventListener('input', filterPublications);
                filterSelect.addEventListener('change', filterPublications);
            } else {
                console.log('Publications data not ready, waiting...');
                setTimeout(initializeResearchArea, 500);
            }
        }

        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeResearchArea);
        } else {
            initializeResearchArea();
        }
    </script>
